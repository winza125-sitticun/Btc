[project]
name = "btc-ai-futures-trader"
version = "0.1.0"
description = "Cloud-first AI-assisted crypto futures trading platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "feedparser>=6.0.11,<7",
  "websockets>=15,<17",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["btc_core*", "services*"]
exclude = ["apps*", "supabase*", "tests*"]
