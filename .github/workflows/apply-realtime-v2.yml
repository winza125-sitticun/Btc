name: Apply Realtime Scanner V2

on:
  push:
    branches: [feat/realtime-scanner-v2]
    paths:
      - realtime-v2.tar.gz.b64
      - .github/workflows/apply-realtime-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand realtime scanner source
        run: |
          set -euo pipefail
          base64 -d realtime-v2.tar.gz.b64 > /tmp/realtime-v2.tar.gz
          tar -xzf /tmp/realtime-v2.tar.gz -C .
          rm -f realtime-v2.tar.gz.b64 .github/workflows/apply-realtime-v2.yml
      - name: Commit feature
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add realtime scanner persistence and dashboard"
          git push origin HEAD:feat/realtime-scanner-v2
