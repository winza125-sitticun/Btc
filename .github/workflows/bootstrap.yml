name: Bootstrap Foundation

on:
  push:
    branches: [main]
    paths:
      - foundation.tar.gz.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand foundation source
        run: |
          set -euo pipefail
          base64 -d foundation.tar.gz.b64 > /tmp/btc-foundation.tar.gz
          tar -xzf /tmp/btc-foundation.tar.gz -C .
          rm -f foundation.tar.gz.b64 .github/workflows/bootstrap.yml
      - name: Commit foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: bootstrap AI futures trader foundation"
          git push origin HEAD:main
