name: Scanner V6 CI

on:
  push:
    branches: ["feature/rez-analysis-v1-inline", "deploy/v6-shadow"]
  pull_request:
    paths:
      - "scanner_v6/**"
      - ".github/workflows/scanner-v6-ci.yml"

jobs:
  scanner-v6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner_v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Assemble runtime files
        run: |
          cat shadow_eval_v6.part* > shadow_eval_v6.py
          cat auto_scanner_v6.part* > auto_scanner_v6.py
      - name: Run Scanner V6 tests
        run: python -m unittest discover -s tests -v
      - name: Compile assembled runtime
        run: |
          python -m py_compile \
            market_data_v6.py \
            setup_score_v6.py \
            shadow_eval_v6.py \
            shadow_report_v6.py \
            rez_analysis_v1.py \
            rez_watch_v1.py \
            rez_report_v1.py \
            auto_scanner_v6.py
      - name: Verify no order execution path
        run: |
          if grep -RniE "create_order|place_order|new_order|futures_create_order|/order" \
            rez_analysis_v1.py rez_watch_v1.py rez_report_v1.py auto_scanner_v6.py; then
            echo "Unexpected order execution path detected"
            exit 1
          fi
          echo "No order execution path detected"
